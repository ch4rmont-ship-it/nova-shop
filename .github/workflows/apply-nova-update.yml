name: Apply NOVA Mongolia catalog update

on:
  push:
    branches: [main]
    paths: [".github/workflows/apply-nova-update.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify and apply update
        shell: bash
        run: |
          set -euo pipefail
          cat .nova-update/parts/00 .nova-update/parts/01 .nova-update/parts/02 .nova-update/parts/03 .nova-update/parts/04 .nova-update/parts/05 > /tmp/nova-update.b64
          base64 --decode /tmp/nova-update.b64 > /tmp/nova-update.tar.gz
          echo "8bd8b8c08d69049206acd4c6f49a84b07b91184402c40b1189e0f5db57438c4f  /tmp/nova-update.tar.gz" | sha256sum -c -
          tar -xzf /tmp/nova-update.tar.gz -C .
          rm -rf .nova-update
          rm -f .github/workflows/apply-nova-update.yml
      - name: Commit storefront update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: launch NOVA Mongolia essentials catalog"
          git push origin main
