name: SmartShop AI Preview QA
on:
  push:
    branches: [smartshop-ai]
  pull_request:
    branches: [main, smartshop-ai]
permissions:
  contents: read
jobs:
  static-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit tests (Node strip types)
        run: node --experimental-strip-types --test tests/unit/*.test.mjs
      - name: Production build (without AI keys)
        run: npm run build
      - name: Install isolated Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run public browser / anonymous API tests
        run: npx playwright test
      - name: Attach E2E report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smartshop-playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
