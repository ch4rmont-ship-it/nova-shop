# Trigger retry after payload integrity repair.
name: Bootstrap NOVA Commerce source

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-project.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Rebuild project source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/parts/00 .bootstrap/parts/01 .bootstrap/parts/02 .bootstrap/parts/03 .bootstrap/parts/04 .bootstrap/parts/05 .bootstrap/parts/06 .bootstrap/parts/07 > /tmp/nova.b64
          base64 --decode /tmp/nova.b64 > /tmp/nova-src.tar.gz
          gzip -t /tmp/nova-src.tar.gz
          tar -xzf /tmp/nova-src.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-project.yml

      - name: Commit project source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add NOVA Commerce application"
          git push origin main
